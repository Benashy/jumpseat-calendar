name: Validate and publish OpsDeck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run check
      - run: pnpm run check:reliability
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:browser
      - run: pnpm run test:browser
        env:
          BROWSER_ENGINE: webkit
          BROWSER_OUTPUT: test-results-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: |
            test-results
            test-results-webkit
          retention-days: 14
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish tested public files
        id: deployment
        uses: actions/deploy-pages@v4
